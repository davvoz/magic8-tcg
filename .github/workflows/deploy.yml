name: Deploy to production

# A push to master deploys only when one of its commit messages contains
# [deploy], e.g. "feat: new card set [deploy]". "Run workflow" in the Actions
# tab deploys the tip of master without a commit.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy on the server
        env:
          SERVER: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh "$SERVER" "sh /opt/magic8/deploy/deploy.sh ${{ github.sha }}"

      - name: Check the public site
        env:
          SITE: https://${{ vars.M8_DOMAIN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$SITE/api/ready"; then
              echo "### Deployed ${{ github.sha }} to $SITE" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "$SITE/api/ready does not answer" >&2
          exit 1
