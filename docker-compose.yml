# Production stack: game server and PostgreSQL. The host's nginx terminates
# TLS and forwards to the app on 127.0.0.1 (deploy/nginx.conf); nothing here is
# reachable from outside. Configuration comes from .env next to this file
# (template: deploy/production.env.example); deploy/README.md explains the setup.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
      # The commit being built (deploy.sh sets APP_TAG), stamped into the image: open tabs see it change and offer to update.
      args:
        M8_BUILD: ${APP_TAG:-}
    # deploy/deploy.sh builds one image per commit and tags the running one "current".
    image: magic8-tcg:${APP_TAG:-current}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      M8_PUBLIC_ORIGIN: https://${M8_DOMAIN:?set M8_DOMAIN in .env}
      M8_DATABASE_URL: postgres://magic8:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/magic8
      M8_TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:${M8_HOST_PORT:-8090}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Ready = the process answers and so does the database.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # The server gives itself 10 s to close cleanly.
    stop_grace_period: 15s
    logging: *logging

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: magic8
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: magic8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "magic8", "-d", "magic8"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  pgdata:
