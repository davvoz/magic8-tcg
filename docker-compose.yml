# Production stack: game server, PostgreSQL, Caddy (TLS and reverse proxy).
# Configuration comes from .env next to this file (template:
# deploy/production.env.example); deploy/README.md explains the setup.
# Only Caddy is reachable from outside.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build: .
    # deploy/deploy.sh builds one image per commit and tags the running one "current".
    image: magic8-tcg:${APP_TAG:-current}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      M8_PUBLIC_ORIGIN: https://${M8_DOMAIN:?set M8_DOMAIN in .env}
      M8_DATABASE_URL: postgres://magic8:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/magic8
      M8_TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Ready = the process answers and so does the database.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # The server gives itself 10 s to close cleanly.
    stop_grace_period: 15s
    logging: *logging

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: magic8
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: magic8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "magic8", "-d", "magic8"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      M8_DOMAIN: ${M8_DOMAIN:?set M8_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The directory, not the file: git checkout replaces the file, and a file mount would keep showing the old one.
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
