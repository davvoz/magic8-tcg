<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic8 preview</title>
  <style>
    /* Same host page as index.html; the canvas is the whole viewport. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0c14; overflow: hidden; }
    canvas#game { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Magic8 preview" role="application"></canvas>
  <script type="importmap">{ "imports": { "@magic8/engine/": "/engine/" } }</script>
  <script type="module" src="preview.js"></script>
</body>
</html>
