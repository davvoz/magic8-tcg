<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: the canvas reaches under a notch, the game keeps its controls clear of it (safe-area insets, read below). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Magic8</title>
  <meta name="description" content="Multiplayer collectible card game">
  <!-- Installable as an app (PWA): the manifest, its icons, and the service worker (sw.js, registered by src/main.js). -->
  <link rel="manifest" href="app.webmanifest">
  <meta name="theme-color" content="#0a0c14">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Magic8">
  <style>
    /* HTML is used only to host the canvas. All game UI is rendered on the canvas, except the loading screen (shown before any script runs), the maintenance banner, the phone keyboard's text strip and the rotate hint. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0c14; overflow: hidden; overscroll-behavior: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    /* Fixed to the dynamic viewport, so a phone's collapsing address bar resizes the game instead of scrolling it. */
    canvas#game { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
    /* Read by src/main.js: its padding resolves the screen's safe-area insets to pixels. */
    #safe-area { position: fixed; inset: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    /* The one HTML overlay: the maintenance announcement (src/rendering/page/MaintenanceBanner.js). */
    .maintenance-banner { position: fixed; top: max(8px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 10; box-sizing: border-box; width: max-content; max-width: min(640px, calc(100% - 32px)); padding: 6px 16px; border-radius: 16px; background: #b45309; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); color: #fff; font: 600 13px/1.4 system-ui, sans-serif; text-align: center; pointer-events: none; }
    .maintenance-banner[hidden] { display: none; }
    .maintenance-banner button { pointer-events: auto; margin-left: 12px; padding: 2px 12px; border: 1px solid #fff; border-radius: 10px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .maintenance-banner button:hover, .maintenance-banner button:focus-visible { background: rgba(255, 255, 255, 0.2); }
    /* The phone keyboard's text strip (src/rendering/page/TextEntryBar.js), pinned above the keyboard at the top of the screen. */
    .text-entry { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; gap: 8px; margin: 0; box-sizing: border-box; padding: max(8px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: #151a27; border-bottom: 2px solid #e2b25c; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6); }
    .text-entry[hidden] { display: none; }
    .text-entry input { flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #78c6ff; border-radius: 10px; background: #0d1019; color: #eef0f5; font: 16px system-ui, sans-serif; -webkit-user-select: text; user-select: text; }
    .text-entry input::placeholder { color: #8f98ad; }
    .text-entry button { height: 44px; padding: 0 20px; border: none; border-radius: 10px; background: #e2b25c; color: #1c1305; font: 700 16px system-ui, sans-serif; }
    /* Phones are played in landscape: held upright, the game asks to be turned. */
    .rotate-hint { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      .rotate-hint { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px; box-sizing: border-box; background: #0a0c14; color: #f7dfa0; font: 600 20px/1.4 'Palatino Linotype', Palatino, Georgia, serif; text-align: center; }
      .rotate-hint::before { content: ""; width: 56px; height: 92px; border: 4px solid #e2b25c; border-radius: 12px; animation: rotate-hint 2.4s ease-in-out infinite; }
      .rotate-hint small { color: #8f98ad; font: 15px system-ui, sans-serif; }
    }
    @keyframes rotate-hint { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
    /* The loading screen, over the canvas until the first screen is ready (src/rendering/page/LoadingScreen.js); under the maintenance banner, which must be read even then. */
    .loading { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2.2vmin, 18px); padding: 16px; box-sizing: border-box; overflow: hidden; background: radial-gradient(ellipse 75% 70% at 50% 42%, #1d2238 0%, #10142a 38%, #0a0c14 68%, #000 100%); color: #f7dfa0; font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; transition: opacity 0.8s ease, visibility 0s linear 0.8s; }
    .loading.is-leaving { opacity: 0; visibility: hidden; }
    .loading.is-leaving .loading-sigil { transform: scale(1.12); }
    /* Faint stars, as in the backdrop's sky. */
    .loading::before { content: ""; position: absolute; inset: -10%; pointer-events: none; opacity: 0.55; background-image: radial-gradient(1.5px 1.5px at 12% 22%, #f7dfa0, transparent), radial-gradient(1px 1px at 28% 74%, #f7dfa0, transparent), radial-gradient(1.5px 1.5px at 44% 12%, #e2b25c, transparent), radial-gradient(1px 1px at 63% 86%, #f7dfa0, transparent), radial-gradient(1.5px 1.5px at 78% 30%, #f7dfa0, transparent), radial-gradient(1px 1px at 90% 64%, #e2b25c, transparent), radial-gradient(1px 1px at 6% 56%, #e2b25c, transparent), radial-gradient(1.5px 1.5px at 54% 52%, #f7dfa0, transparent), radial-gradient(1px 1px at 34% 40%, #e2b25c, transparent), radial-gradient(1px 1px at 84% 10%, #f7dfa0, transparent); animation: loading-twinkle 5s ease-in-out infinite alternate; }
    .loading-sigil { position: relative; width: clamp(110px, 34vmin, 230px); aspect-ratio: 1; transition: transform 0.8s ease; }
    .loading-sigil svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .loading-sigil .ring-outer { transform-origin: 0 0; animation: loading-turn 60s linear infinite; }
    .loading-sigil .ring-inner { transform-origin: 0 0; animation: loading-turn 40s linear infinite reverse; }
    .loading-sigil .orbit { transform-origin: 0 0; animation: loading-turn 9s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .loading-sigil .star { transform-origin: 0 0; animation: loading-pulse 2.8s ease-in-out infinite; }
    .loading-title { margin: 0; font-size: clamp(36px, 9vmin, 84px); font-weight: 700; letter-spacing: 0.16em; padding-left: 0.16em; line-height: 1; color: #f7dfa0; text-shadow: 0 0 18px rgba(226, 178, 92, 0.55), 0 0 2px #8a5f1e; }
    .loading-ornament { position: relative; width: min(320px, 60vw); height: 1px; background: linear-gradient(90deg, transparent, #e2b25c 35%, #e2b25c 65%, transparent); }
    .loading-ornament::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; background: #f7dfa0; transform: translate(-50%, -50%) rotate(45deg); box-shadow: 0 0 8px #e2b25c; }
    .loading-bar { position: relative; width: min(360px, 70vw); height: 3px; margin-top: clamp(4px, 1.5vmin, 12px); border-radius: 2px; background: rgba(226, 178, 92, 0.16); }
    .loading-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--loading-progress, 0.02) * 100%); border-radius: 2px; background: linear-gradient(90deg, #8a5f1e, #e2b25c 60%, #f7dfa0); box-shadow: 0 0 10px rgba(226, 178, 92, 0.6); transition: width 0.5s ease-out; }
    /* Until the game's scripts run, the bar creeps on its own. */
    .loading:not([data-live]) .loading-bar-fill { animation: loading-creep 7s cubic-bezier(0.1, 0.6, 0.3, 1) forwards; }
    .loading-bar-fill::after { content: ""; position: absolute; right: -4px; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: #fff6dc; transform: translateY(-50%); box-shadow: 0 0 6px #f7dfa0, 0 0 14px #e2b25c; }
    .loading-status { margin: 0; min-height: 1.4em; color: #8f98ad; font-size: clamp(13px, 2.4vmin, 17px); font-style: italic; letter-spacing: 0.06em; }
    @keyframes loading-turn { to { transform: rotate(360deg); } }
    @keyframes loading-pulse { 0%, 100% { transform: scale(1); opacity: 0.88; } 50% { transform: scale(1.07); opacity: 1; } }
    @keyframes loading-twinkle { from { opacity: 0.25; } to { opacity: 0.7; } }
    @keyframes loading-creep { from { width: 2%; } to { width: 30%; } }
    @media (prefers-reduced-motion: reduce) {
      .loading::before, .loading-sigil .ring-outer, .loading-sigil .ring-inner, .loading-sigil .orbit, .loading-sigil .star { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Magic8 card game" role="application"></canvas>
  <div id="safe-area" aria-hidden="true"></div>
  <div id="loading" class="loading" role="progressbar" aria-label="Loading Magic8" aria-busy="true" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="loading-sigil" aria-hidden="true">
      <svg viewBox="-100 -100 200 200">
        <defs>
          <linearGradient id="loading-gold" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
            <stop offset="0" stop-color="#fff1c4"/><stop offset="0.45" stop-color="#e2b25c"/><stop offset="1" stop-color="#8a5f1e"/>
          </linearGradient>
          <radialGradient id="loading-halo"><stop offset="0" stop-color="#e2b25c" stop-opacity="0.35"/><stop offset="1" stop-color="#e2b25c" stop-opacity="0"/></radialGradient>
        </defs>
        <circle r="70" fill="url(#loading-halo)"/>
        <g class="ring-outer" fill="none" stroke="#e2b25c">
          <circle r="93" stroke-width="1.2" stroke-opacity="0.75"/>
          <circle r="89" stroke-width="5" stroke-opacity="0.6" stroke-dasharray="0.8 6.967"/>
          <circle r="85" stroke-width="0.6" stroke-opacity="0.5"/>
          <path d="M0 -99 L3 -93 L0 -87 L-3 -93 Z M99 0 L93 3 L87 0 L93 -3 Z M0 99 L-3 93 L0 87 L3 93 Z M-99 0 L-93 -3 L-87 0 L-93 3 Z" fill="#f7dfa0" stroke="none"/>
        </g>
        <g class="ring-inner" fill="none" stroke="#e2b25c">
          <circle r="62" stroke-width="0.8" stroke-opacity="0.55" stroke-dasharray="2 5"/>
          <circle r="56" stroke-width="0.6" stroke-opacity="0.4"/>
          <path d="M0 -62 L-56 0 L0 62 L56 0 Z" stroke-width="0.6" stroke-opacity="0.35"/>
          <g fill="#f7dfa0" stroke="none"><circle cx="44" cy="-44" r="1.6"/><circle cx="-44" cy="-44" r="1.6"/><circle cx="44" cy="44" r="1.6"/><circle cx="-44" cy="44" r="1.6"/></g>
        </g>
        <g class="orbit">
          <path d="M0 -82 A8 8 0 0 0 0 -66 A10 10 0 0 1 0 -82 Z" fill="#f7dfa0" transform="rotate(-20 0 -74)"/>
          <circle cy="74" r="2" fill="#f7dfa0"/>
        </g>
        <g class="star">
          <path d="M0 -24 L5 -5 L24 0 L5 5 L0 24 L-5 5 L-24 0 L-5 -5 Z" fill="url(#loading-gold)" transform="rotate(45)" opacity="0.8"/>
          <path d="M0 -42 L7 -7 L42 0 L7 7 L0 42 L-7 7 L-42 0 L-7 -7 Z" fill="url(#loading-gold)"/>
          <path d="M0 -42 L7 -7 L0 0 Z M42 0 L7 7 L0 0 Z M0 42 L-7 7 L0 0 Z M-42 0 L-7 -7 L0 0 Z" fill="#8a5f1e" opacity="0.45"/>
          <circle r="3" fill="#fff6dc"/>
        </g>
      </svg>
    </div>
    <h1 class="loading-title">MAGIC8</h1>
    <div class="loading-ornament" aria-hidden="true"></div>
    <div class="loading-bar" aria-hidden="true"><div class="loading-bar-fill"></div></div>
    <p class="loading-status">Reading the stars…</p>
  </div>
  <div class="rotate-hint" role="alert">Turn your device sideways<small>Magic8 is played in landscape</small></div>
  <noscript>This game requires JavaScript.</noscript>
  <script type="importmap">{ "imports": { "@magic8/engine/": "/engine/", "@magic8/protocol": "/protocol/index.js", "@magic8/steem": "/steem/index.js", "@noble/hashes/": "/vendor/noble-hashes/", "@noble/curves/": "/vendor/noble-curves/" } }</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
