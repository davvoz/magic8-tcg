<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Magic8</title>
  <meta name="description" content="Multiplayer collectible card game">
  <!-- Installable as an app (PWA): the manifest, its icons, and the service worker (sw.js, registered by src/main.js). -->
  <link rel="manifest" href="app.webmanifest">
  <meta name="theme-color" content="#0a0c14">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Magic8">
  <style>
    /* HTML is used only to host the canvas. All game UI is rendered on the canvas, except the maintenance banner. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0c14; overflow: hidden; }
    canvas#game { display: block; width: 100%; height: 100%; touch-action: none; }
    /* The one HTML overlay: the maintenance announcement (src/rendering/page/MaintenanceBanner.js). */
    .maintenance-banner { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 10; box-sizing: border-box; width: max-content; max-width: min(640px, calc(100% - 32px)); padding: 6px 16px; border-radius: 16px; background: #b45309; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); color: #fff; font: 600 13px/1.4 system-ui, sans-serif; text-align: center; pointer-events: none; }
    .maintenance-banner[hidden] { display: none; }
    .maintenance-banner button { pointer-events: auto; margin-left: 12px; padding: 2px 12px; border: 1px solid #fff; border-radius: 10px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .maintenance-banner button:hover, .maintenance-banner button:focus-visible { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Magic8 card game" role="application"></canvas>
  <noscript>This game requires JavaScript.</noscript>
  <script type="importmap">{ "imports": { "@magic8/engine/": "/engine/", "@magic8/protocol": "/protocol/index.js", "@magic8/steem": "/steem/index.js", "@noble/hashes/": "/vendor/noble-hashes/", "@noble/curves/": "/vendor/noble-curves/" } }</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
