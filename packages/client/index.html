<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Magic8</title>
  <style>
    /* HTML is used only to host the canvas. All game UI is rendered on the canvas. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0c14; overflow: hidden; }
    canvas#game { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Magic8 card game" role="application"></canvas>
  <noscript>This game requires JavaScript.</noscript>
  <script type="importmap">{ "imports": { "@magic8/engine/": "/engine/" } }</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
