# nginx site for the game, on the host (not in Docker). Install:
#   sed 's/GAME_DOMAIN/tcg.example.com/g' deploy/nginx.conf > /etc/nginx/sites-available/magic8
#   ln -s /etc/nginx/sites-available/magic8 /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d tcg.example.com      (adds https and the http→https redirect)
# The app listens on 127.0.0.1:8090 (M8_HOST_PORT). $proxy_add_x_forwarded_for
# appends the client address, the last entry the server reads with M8_TRUST_PROXY=true.
server {
    listen 80;
    listen [::]:80;
    server_name GAME_DOMAIN;

    # Game WebSocket: kept open for the whole session.
    location = /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
