# The production image on this computer: app + PostgreSQL over plain http on
# http://localhost:8081, without nginx. It does not read .env (the development keys
# stay out: nothing is published on chain). Usage: npm run docker:up / docker:down
name: magic8-local

services:
  app:
    env_file: !reset []
    environment:
      M8_PUBLIC_ORIGIN: http://localhost:8081
      M8_TRUST_PROXY: "false"
      M8_LOG_FORMAT: pretty
    ports: !override
      - "8081:8080"

  # No bot by default; to try them: M8_BOT_KEYS="account:WIF,…" npm run docker:up (never in local.env, which is committed).
  bots:
    env_file: !reset []
    environment:
      M8_BOT_ORIGIN: http://localhost:8081
      M8_BOT_KEYS: ${M8_BOT_KEYS:-}
      M8_LOG_LEVEL: info
