<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Served by nginx while the game server is down (error_page in deploy/nginx.conf); reloads until the game is back. -->
  <meta http-equiv="refresh" content="20">
  <title>KIJAM · Maintenance</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
      background: radial-gradient(ellipse at center, #141a2e 0%, #0a0c14 70%); color: #c9cbd6;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    main { max-width: 32rem; }
    h1 { margin: 0 0 8px; color: #d9b25f; font: 700 clamp(2.5rem, 10vw, 4rem)/1 Georgia, "Times New Roman", serif; letter-spacing: 0.04em; }
    .rule { width: 12rem; height: 1px; margin: 16px auto 24px; background: linear-gradient(90deg, transparent, #d9b25f, transparent); }
    h2 { margin: 0 0 12px; color: #f0e6cc; font-size: 1.25rem; font-weight: 600; }
    p { margin: 0 0 8px; }
    .small { color: #7d8196; font-size: 0.875rem; }
    .dots span { animation: blink 1.4s infinite both; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  </style>
</head>
<body>
  <main>
    <h1>KIJAM</h1>
    <div class="rule"></div>
    <h2>We are updating the game<span class="dots"><span>.</span><span>.</span><span>.</span></span></h2>
    <p>KIJAM will be back in a few minutes. Your cards, decks and orders are safe.</p>
    <p class="small">This page reloads by itself.</p>
  </main>
</body>
</html>
